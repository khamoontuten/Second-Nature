name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check app tests
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -e "./backend"
      - run: npm ci && npm run build
        working-directory: frontend
      - name: Install Playwright (CI only; not a project dependency)
        working-directory: frontend
        run: npm install --no-save playwright@1.63.0 && npx playwright install --with-deps chromium
      - name: Start the app
        run: |
          export SN_DATA_DIR="$RUNNER_TEMP/sn-data" SN_DATABASE_URL="sqlite:///$RUNNER_TEMP/sn-data/sn.db"
          mkdir -p "$SN_DATA_DIR"
          cd backend && nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/uvicorn.log" 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8000/api/health && break; sleep 1; done
      - name: Strategy-impact acceptance test (UI)
        working-directory: frontend
        run: node e2e/impacts.mjs
      - name: Workbench smoke test (UI; creates and simulates the demo project)
        working-directory: frontend
        run: node e2e/workflow.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: frontend/e2e/screenshots
